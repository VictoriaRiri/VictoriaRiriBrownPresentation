name: Generate PPTX

# allow manual run or run on push when portrait image or script is updated
on:
  workflow_dispatch:
  push:
    paths:
      - 'Screenshot_2026-08-17-06-32-28-567_com.google.android.googlequicksearchbox.jpg'
      - 'make_presentation.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx pillow matplotlib

      - name: Run generator
        run: |
          python make_presentation.py

      - name: Commit generated presentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Victoria_Riri_Wagura_Brown_Application.pptx || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate presentation PPTX"
            git push
          fi
